name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install graphics and audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev xvfb
      - name: Validate release metadata
        shell: bash
        run: |
          version="$(cat VERSION)"
          test -f "docs/releases/$version.md"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - run: go mod verify
      - run: go vet ./...
      - name: Verify race partitioning
        run: python3 scripts/test_race_shards.py
      - name: Full tests and coverage
        run: xvfb-run -a go test -timeout=20m -count=1 -coverprofile=coverage.out ./...
      - name: Release qualification
        run: xvfb-run -a make test-qualify
      - name: Full-load release soak
        run: xvfb-run -a make test-soak
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install graphics and audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev xvfb
      # The unsharded suite exceeded 90 minutes on the hosted runner. Keep
      # every top-level test and its subtests, partitioned into eight jobs.
      - name: Full-suite race partition
        run: xvfb-run -a python3 scripts/run_race_shard.py --index ${{ matrix.shard }} --count 8 --output race-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-${{ matrix.shard }}
          path: race-results/
          if-no-files-found: error

  build:
    needs: [test, race]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev
      - name: Build release archive
        run: python scripts/package_release.py --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - name: Verify archive metadata and checksums
        shell: bash
        run: python scripts/verify_release.py dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: busgame-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require passing release qualification
        run: python3 scripts/verify_release_qualification.py
      - uses: actions/download-artifact@v4
        with:
          pattern: busgame-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "$version" --notes-file "docs/releases/$version.md" --latest
